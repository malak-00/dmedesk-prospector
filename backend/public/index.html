<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DME Desk Prospector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark">DME</span>
      <span class="brand-name">Desk Prospector</span>
    </div>
    <div class="status" id="statusIndicator"><span class="status-dot"></span><span id="statusText">Ready</span></div>
  </header>

  <main class="app-main">
    <section class="search-panel" aria-label="Search filters">
      <form id="searchForm">
        <div class="field-grid">
          <label class="field">
            <span>Organization name (starts with)</span>
            <input type="text" name="organizationName" placeholder="e.g. Global Med Supply">
          </label>
          <label class="field">
            <span>State</span>
            <select name="state" id="stateSelect">
              <option value="">All states</option>
            </select>
          </label>
          <label class="field">
            <span>City</span>
            <input type="text" name="city" id="cityInput" list="cityOptions" placeholder="All cities" autocomplete="off">
            <datalist id="cityOptions"></datalist>
          </label>
          <label class="field">
            <span>Postal code</span>
            <input type="text" name="postalCode" placeholder="33601">
          </label>
          <label class="field field-wide">
            <span>Specialty / taxonomy</span>
            <input type="text" name="taxonomyDescription" value="Durable Medical Equipment" placeholder="e.g. Durable Medical Equipment">
          </label>
          <label class="field">
            <span>Name contains</span>
            <input type="text" name="nameContains" placeholder="e.g. equipment">
          </label>
          <label class="field">
            <span>Limit</span>
            <input type="number" name="limit" value="20" min="1" max="50">
          </label>
        </div>
        <div class="field-row">
          <label class="checkbox">
            <input type="checkbox" name="enrich" checked>
            <span>Enrich with Places data</span>
          </label>
          <label class="checkbox">
            <input type="checkbox" name="scrape">
            <span>Scrape websites for contacts <em>(slower)</em></span>
          </label>
          <button type="submit" class="btn btn-primary" id="searchBtn">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            <span>Search leads</span>
          </button>
        </div>
      </form>
    </section>

    <section class="results-panel">
      <div class="results-toolbar">
        <div class="results-meta">
          <div class="results-count" id="resultsCount">No search run yet</div>
          <div class="selection-chip" id="selectionChip" hidden>
            <span id="selectionCount">0 selected</span>
            <button type="button" class="link-btn" id="clearSelectionBtn">Clear</button>
          </div>
        </div>
        <div class="results-actions">
          <button class="btn btn-ghost" id="exportCsvBtn" disabled>
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1v9m0 0L4.5 6.5M8 10l3.5-3.5M2 12v2a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span id="exportCsvLabel">Export CSV</span>
          </button>
          <button class="btn btn-ghost" id="exportSheetsBtn" disabled>
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2 6.5h12M2 10.5h12M6.5 2v12" stroke="currentColor" stroke-width="1.4"/></svg>
            <span id="exportSheetsLabel">Export to Sheets</span>
          </button>
        </div>
      </div>

      <div class="table-wrap">
        <table class="results-table" id="resultsTable">
          <thead>
            <tr>
              <th class="col-check"><input type="checkbox" id="selectAll"></th>
              <th class="col-score">Score</th>
              <th>Company</th>
              <th>Location</th>
              <th>Contact</th>
              <th>Contact phone</th>
              <th class="col-expand"></th>
            </tr>
          </thead>
          <tbody id="resultsBody">
            <tr class="empty-row"><td colspan="7">Run a search to see leads here.</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/usLocations.js"></script>
  <script src="/app.js"></script>
</body>
</html>
