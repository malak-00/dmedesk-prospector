<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DME Desk Prospector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=10">
</head>
<body>
  <div id="loginOverlay" class="login-overlay" hidden>
    <form id="loginForm" class="login-card">
      <div class="brand login-brand">
        <span class="brand-mark">DME</span>
        <span class="brand-name">Desk Prospector</span>
      </div>
      <label class="field">
        <span>Username</span>
        <input type="text" name="username" autocomplete="username" required autofocus>
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <div class="login-error" id="loginError" hidden></div>
      <button type="submit" class="btn btn-primary login-btn" id="loginBtn">Sign in</button>
    </form>
  </div>

  <header class="app-header">
    <div class="brand">
      <span class="brand-mark">DME</span>
      <span class="brand-name">Desk Prospector</span>
    </div>
    <div class="header-right">
      <div class="user-chip" id="userChip" hidden>
        <span id="userName"></span>
        <button type="button" class="link-btn" id="signOutBtn">Sign out</button>
      </div>
      <div class="status" id="statusIndicator"><span class="status-dot"></span><span id="statusText">Ready</span></div>
    </div>
  </header>

  <main class="app-main">
    <nav class="view-tabs">
      <button type="button" class="tab active" data-view="search">Prospect</button>
      <button type="button" class="tab" data-view="claimed">Claimed leads</button>
    </nav>

    <div id="viewSearch">
      <section class="search-panel" aria-label="Search filters">
        <form id="searchForm">
          <div class="field-grid">
            <label class="field" title="Looks up this exact NPI directly and ignores every other filter below">
              <span>NPI (exact lookup)</span>
              <input type="text" name="npi" placeholder="1234567890" inputmode="numeric" pattern="\d{10}" maxlength="10" title="NPI is exactly 10 digits">
            </label>
            <label class="field">
              <span>Company name (contains)</span>
              <input type="text" name="nameContains" placeholder="e.g. equipment">
            </label>
            <label class="field">
              <span>State</span>
              <select name="state" id="stateSelect">
                <option value="">All states</option>
              </select>
            </label>
            <label class="field">
              <span>City</span>
              <input type="text" name="city" id="cityInput" list="cityOptions" placeholder="All cities" autocomplete="off">
              <datalist id="cityOptions"></datalist>
            </label>
            <label class="field">
              <span>Postal code</span>
              <input type="text" name="postalCode" placeholder="33601">
            </label>
            <label class="field field-wide">
              <span>Specialty / taxonomy</span>
              <select name="taxonomyDescription">
                <option value="" selected>All specialties</option>
                <option value="Durable Medical Equipment">Durable Medical Equipment &amp; Medical Supplies</option>
                <option value="Oxygen Equipment">DME — Oxygen Equipment &amp; Supplies</option>
                <option value="Prosthetic/Orthotic">Prosthetic/Orthotic Supplier</option>
                <option value="Orthopedic">Orthopedics (any orthopedic specialty)</option>
                <option value="Prosthetic">Prosthetics (any prosthetic specialty)</option>
              </select>
            </label>
            <label class="field">
              <span>Last updated (year)</span>
              <select name="lastUpdatedYear" id="lastUpdatedYearSelect">
                <option value="">Any year</option>
              </select>
            </label>
            <label class="field">
              <span>Limit</span>
              <input type="number" name="limit" value="20" min="1" max="50">
            </label>
          </div>
          <div class="field-row">
            <label class="checkbox">
              <input type="checkbox" name="enrich" checked>
              <span>Enrich with Places data</span>
            </label>
            <label class="checkbox">
              <input type="checkbox" name="scrape">
              <span>Scrape websites for contacts <em>(slower)</em></span>
            </label>
            <button type="submit" class="btn btn-primary" id="searchBtn">
              <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
              <span>Search leads</span>
            </button>
          </div>
        </form>
      </section>

      <section class="results-panel">
        <div class="results-toolbar">
          <div class="results-meta">
            <div class="results-count" id="resultsCount">No search run yet</div>
            <div class="selection-chip" id="selectionChip" hidden>
              <span id="selectionCount">0 selected</span>
              <button type="button" class="link-btn" id="clearSelectionBtn">Clear</button>
            </div>
          </div>
          <div class="results-actions">
            <button class="btn btn-ghost" id="exportCsvBtn" disabled>
              <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1v9m0 0L4.5 6.5M8 10l3.5-3.5M2 12v2a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span id="exportCsvLabel">Export CSV</span>
            </button>
            <button class="btn btn-ghost" id="exportSheetsBtn" disabled>
              <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2 6.5h12M2 10.5h12M6.5 2v12" stroke="currentColor" stroke-width="1.4"/></svg>
              <span id="exportSheetsLabel">Export to Sheets</span>
            </button>
          </div>
        </div>

        <div class="table-wrap">
          <table class="results-table" id="resultsTable">
            <thead>
              <tr>
                <th class="col-check"><input type="checkbox" id="selectAll"></th>
                <th class="col-score">Score</th>
                <th>Company</th>
                <th>Location</th>
                <th>Contact</th>
                <th>Contact phone</th>
                <th class="col-expand"></th>
              </tr>
            </thead>
            <tbody id="resultsBody">
              <tr class="empty-row"><td colspan="7">Run a search to see leads here.</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>

    <div id="viewClaimed" hidden>
      <section class="results-panel">
        <div class="results-toolbar">
          <div class="results-meta">
            <div class="results-count" id="claimedCount">Claimed leads</div>
            <label class="checkbox">
              <input type="checkbox" id="onlyMine">
              <span>Only mine</span>
            </label>
            <label class="inline-field">
              <span>Updated</span>
              <select id="updatedWithin">
                <option value="">Any time</option>
                <option value="1">Today</option>
                <option value="7">Last 7 days</option>
                <option value="30">Last 30 days</option>
                <option value="90">Last 90 days</option>
              </select>
            </label>
            <label class="inline-field">
              <span>Year</span>
              <select id="updatedYear">
                <option value="">Any year</option>
              </select>
            </label>
          </div>
          <div class="results-actions">
            <button class="btn btn-ghost" id="refreshClaimedBtn">
              <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 1.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span>Refresh</span>
            </button>
          </div>
        </div>

        <div class="table-wrap">
          <table class="results-table">
            <thead>
              <tr>
                <th>Company / contact</th>
                <th>Location</th>
                <th>Contact phone</th>
                <th>Claimed by</th>
                <th>Updated</th>
                <th>Status</th>
                <th>Notes</th>
                <th class="col-expand"></th>
              </tr>
            </thead>
            <tbody id="claimedBody">
              <tr class="empty-row"><td colspan="8">Open this tab to load claimed leads.</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="config.js?v=10"></script>
  <script src="usLocations.js?v=10"></script>
  <script src="app.js?v=10"></script>
</body>
</html>
